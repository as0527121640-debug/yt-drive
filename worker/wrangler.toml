# yt-drive Worker. Deploy: cd cloud\yt-drive ; npx wrangler deploy
# Secrets: npx wrangler secret put APP_PASSWORD / GH_TOKEN / YT_API_KEY
name = "yt-drive"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
GH_REPO = "as0527121640-debug/yt-drive"
GH_REF = "main"
WORKFLOW = "yt-drive.yml"
