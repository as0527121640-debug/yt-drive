# kan-index - refresh data/kan-index.json (every series on Kan's VOD lobby pages) once a day.
# The site's Worker searches this small file (it fetches it from raw.githubusercontent.com), because Kan's own search
# is a third-party widget without a usable API. Manual run: Actions tab -> kan-index -> Run workflow.
name: kan-index

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the index
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}      # fallback if Kan challenges this network
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python3 scripts/build_kan_index.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/kan-index.json)" ]; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kan-index.json
          git commit -m "kan-index: refresh $(date -u +%F)"
          git push
