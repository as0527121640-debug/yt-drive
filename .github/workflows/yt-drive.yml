# yt-drive - download a YouTube / Kan / Reshet 13 video or audio with yt-dlp and (if rclone is configured) push it to Google Drive.
# Triggered by the yt-drive Cloudflare Worker (cloud/yt-drive) or manually from the Actions tab.
# If secret RCLONE_CONF_BASE64 is set -> the file goes to Drive (folder from var DRIVE_DIR, default "YouTube").
# Otherwise the file is attached to the job-<id> prerelease so the site can download it.
name: yt-drive
run-name: "yt [${{ inputs.job_id }}]: ${{ inputs.input }}"

on:
  workflow_dispatch:
    inputs:
      input:
        description: 'YouTube, Kan or Reshet 13 URL'
        required: true
      format:
        description: 'video (mp4) or audio (mp3)'
        type: choice
        options: [video, audio]
        default: video
      quality:
        description: 'max video quality'
        type: choice
        options: [best, "1080", "720", "480"]
        default: "1080"
      playlist:
        description: 'download the playlist the link points to (instead of only the single video)'
        type: choice
        options: ["no", "yes"]
        default: "no"
      max_items:
        description: 'playlist: how many items from the start (1-100)'
        required: false
        default: "50"
      job_id:
        description: 'site job id (empty for manual runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 240                              # a 100-item video playlist is long; single videos finish in minutes
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
      INPUT: ${{ inputs.input }}
      FORMAT: ${{ inputs.format }}
      QUALITY: ${{ inputs.quality }}
      PLAYLIST: ${{ inputs.playlist }}
      MAX_ITEMS: ${{ inputs.max_items }}
      RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}          # optional: Netscape cookies.txt of a (secondary) Google account
      YT_PROXY: ${{ secrets.YT_PROXY }}              # optional: http(s)/socks proxy, e.g. a residential/Israeli one
      RELAY: ${{ vars.RELAY_URL }}                   # il-relay Worker (runs in Cloudflare Tel Aviv) for Kan streams
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      DRIVE_DIR: ${{ vars.DRIVE_DIR || 'YouTube' }}
      KAN_DRIVE_DIR: ${{ vars.KAN_DRIVE_DIR }}         # Kan / Reshet 13 get their own Drive folders (default Kan, 13)
      C13_DRIVE_DIR: ${{ vars.C13_DRIVE_DIR }}
    # YouTube flags datacenter IPs ("Sign in to confirm you're not a bot"). The open-source answer (yt-dlp, cobalt,
    # Invidious) is a chain: PO token + visitor_data from a BotGuard generator, then alternate player clients, then
    # cookies/proxy if provided. The generator runs here as a sidecar - the one yt-dlp's own PO-token guide recommends.
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - name: Install tools
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          # deno: yt-dlp's JS runtime for YouTube's player challenge
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          # yt-dlp from pip so the PO-token plugin is discovered next to it
          python3 -m venv "$HOME/ytv"
          # curl-cffi: browser impersonation, needed by sites like kan.org.il (generic extractor + Kaltura HLS)
          "$HOME/ytv/bin/pip" install -q -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          echo "$HOME/ytv/bin" >> "$GITHUB_PATH"
          "$HOME/ytv/bin/yt-dlp" --version

      # Cloudflare WARP in proxy mode: a free egress through Cloudflare's IPs instead of GitHub's flagged Azure ones.
      - name: Start Cloudflare WARP (proxy mode)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y cloudflare-warp
          sudo systemctl start warp-svc || true; sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do
            ip=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' | tr '\n' ' ')
            case "$ip" in *warp=on*|*warp=plus*) echo "WARP up: $ip"; echo "WARP=1" >> "$GITHUB_ENV"; break;; esac
            sleep 2
          done

      - name: Download
        run: |
          mkdir -p out
          # Kan file name from the episode page. Unicode-aware on purpose: an ASCII-only filter (tr [:alnum:]) deletes
          # every Hebrew letter and left "_1.mp4" for "עלומים | פרק 1".
          cat > kan_name.py <<'PY'
          import html, json, re, sys
          h = sys.stdin.read()
          name = ""
          if len(sys.argv) > 1 and sys.argv[1] == "--plain":
              name = h.strip()                   # plain text (e.g. a series name): only sanitize it
          # 1) the page's VideoObject in JSON-LD carries the full title: "series | episode - subtitle"
          for blk in ([] if name else re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', h, re.S)):
              try:
                  data = json.loads(blk)
              except ValueError:
                  continue
              stack = [data]
              while stack and not name:
                  o = stack.pop()
                  if isinstance(o, list):
                      stack.extend(o)
                  elif isinstance(o, dict):
                      if o.get("@type") == "VideoObject" and o.get("name"):
                          name = o["name"]
                      stack.extend(o.values())
          # 2) fall back to og:title, then <title>
          if not name:
              for pat in (r'<meta\s+property="og:title"\s+content="([^"]*)"', r"<title>([^<]*)"):
                  m = re.search(pat, h)
                  if m:
                      name = m.group(1)
                      break
          name = html.unescape(name)
          name = re.sub(r"\s*\|\s*", " - ", name)                # "series | episode" -> "series - episode"
          name = re.sub(r'[\\/:*?"<>%\x00-\x1f]', " ", name)      # illegal in file names / yt-dlp output templates
          name = re.sub(r"\s+", " ", name).strip(" .-")
          print(name[:110].rstrip(" .-"))
          PY
          # Kan season / series page -> its episode pages. Line 1 = the series name, then one episode URL per line, in
          # order (a series = all its seasons, season 1 first), at most $2. curl, not urllib: Kan's bot protection
          # answers Python's HTTP client with 403.
          cat > kan_list.py <<'PY'
          import html, os, re, subprocess, sys
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) "
                "Chrome/124.0 Safari/537.36")
          CURL = os.environ.get("CURL_BIN", "curl")      # only for local tests on Windows (System32 curl.exe is challenged)
          def curl(u):
              r = subprocess.run([CURL, "-sL", "--max-time", "60", "-A", UA, u], capture_output=True)
              return r.stdout.decode("utf-8", "replace")
          EP = re.compile(r'<a\s+href="(https://www\.kan\.org\.il/content/kan/[^"]+/p-\d+/s\d+/\d+/)"\s+class="card card-row')
          SEASON = re.compile(r'<a\s+class="dropdown-item"\s+href="(https://www\.kan\.org\.il/content/kan/[^"]+/p-\d+/s(\d+)/)"')
          def episodes(page):
              return list(dict.fromkeys(EP.findall(page)))
          def program(page):
              for pat in (r"npawData\.program\s*=\s*decodeEntities\('([^']*)'\)",
                          r'<meta\s+property="og:title"\s+content="([^"]*)"', r"<title>\s*([^<]*)"):
                  m = re.search(pat, page)
                  t = re.sub(r"\s*[-|]?\s*(פרקים מלאים.*|עונה \d+.*)$", "", html.unescape(m.group(1))).strip() if m else ""
                  if t:
                      return t
              return ""
          url, limit = sys.argv[1], int(sys.argv[2])
          page = curl(url)
          urls = []
          if re.search(r"/s\d+/?$", url):
              urls = episodes(page)                       # one season
          else:
              seasons = sorted({(int(n), u) for u, n in SEASON.findall(page)})
              if seasons:
                  for _, u in seasons:                    # every season, season 1 first
                      urls += episodes(curl(u))
              else:
                  urls = episodes(page) or episodes(curl(url.rstrip("/") + "/s1/"))
          print(program(page))
          for u in list(dict.fromkeys(urls))[:limit]:
              print(u)
          PY
          # Reshet 13 URL (the Worker's canonical shape) -> line 1 = the series name, then "entryId<TAB>title" per episode,
          # at most $2. The catalogue is Kaltura OTT (partner 5031) with an anonymous session, as the 13tv.co.il player
          # uses; ordering matches the Worker's list (by episode number; a season of 100+ gives the latest first).
          cat > c13_list.py <<'PY'
          import json, re, sys, urllib.parse, urllib.request
          B = "https://5031.frp1.ott.kaltura.com/api_v3/service/"
          def call(svc, body):
              req = urllib.request.Request(B + svc, json.dumps(dict(body, apiVersion="5.4.0")).encode(),
                                           {"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"})
              res = json.load(urllib.request.urlopen(req, timeout=30))["result"]
              if isinstance(res, dict) and res.get("error"):
                  sys.exit("13 api error: %s" % res["error"].get("message"))
              return res
          ks = call("ottuser/action/anonymousLogin", {"partnerId": 5031})["ks"]
          def lst(ksql, n, order=None, props="id,name,metas,entryId"):
              f = {"objectType": "KalturaSearchAssetFilter", "kSql": ksql}
              if order:
                  f["dynamicOrderBy"] = {"objectType": "KalturaDynamicOrderBy", "name": order[0], "orderBy": order[1]}
              return call("asset/action/list", {"ks": ks, "filter": f, "pager": {"pageSize": n, "pageIndex": 1},
                          "responseProfile": {"objectType": "KalturaOnDemandResponseProfile", "retrievedProperties": props}})
          def meta(o, k):
              return ((o.get("metas") or {}).get(k) or {}).get("value")
          def season_eps(sid, season):
              q = "(and SeriesID='%s' asset_type='1268'%s)" % (sid, " SeasonNumber='%s'" % season if season else "")
              r = lst(q, 100, ("EpisodeNumber", "META_ASC"))
              if (r.get("totalCount") or 0) > 100:
                  r = lst(q, 100, ("EpisodeNumber", "META_DESC"))
              return r.get("objects") or []
          url, limit = sys.argv[1], int(sys.argv[2])
          path = urllib.parse.urlparse(url).path
          m = re.search(r"/series/(\d+)(?:/season/(\d+)(?:/(\d+))?)?/?$", path)
          a = re.search(r"^/allshows/(\d+)/?$", path)
          title, eps = "", []
          if (m and m.group(3)) or a:
              eps = [call("asset/action/get", {"ks": ks, "id": m.group(3) if m and m.group(3) else a.group(1),
                                               "assetReferenceType": "media"})]
          elif m:
              sid, season = m.group(1), m.group(2)
              s = lst("(and SeriesID='%s' asset_type='1259')" % sid, 1, props="id,name").get("objects") or []
              title = s[0]["name"] if s else ""
              if season:
                  eps = season_eps(sid, season)
              else:
                  q = "(and SeriesID='%s' asset_type='1268')" % sid
                  lo = lst(q, 1, ("SeasonNumber", "META_ASC"), "metas").get("objects") or [{}]
                  hi = lst(q, 1, ("SeasonNumber", "META_DESC"), "metas").get("objects") or [{}]
                  if meta(lo[0], "SeasonNumber") and meta(hi[0], "SeasonNumber"):
                      for n in range(int(meta(lo[0], "SeasonNumber")), int(meta(hi[0], "SeasonNumber")) + 1):
                          eps += season_eps(sid, n)
                          if len(eps) >= limit:
                              break
                  else:
                      eps = season_eps(sid, "")
          print(title)
          for o in [e for e in eps if e.get("entryId")][:limit]:
              name = re.sub(r"\s*:\s*", " - ", re.sub(r"[\t\r\n]+", " ", o.get("name") or o["entryId"]))  # "פרק 7: שם" -> "פרק 7 - שם"
              print("%s\t%s" % (o["entryId"], name))
          PY
          # Per-item upload for playlists (used with yt-dlp --exec after_move): send the finished file to Drive, delete
          # the local copy, and record its path for the release notes.
          cat > upload_one.sh <<'SH'
          f="$1"
          rel=$(realpath -m --relative-to=out "$f")
          if rclone moveto "$f" "gdrive:${DRIVE_DIR}/${rel}" --log-level ERROR; then
            printf '%s\n' "$rel" >> names.txt
          else
            echo "upload failed for: $rel (kept on the runner; the final copy step retries it)" >&2
          fi
          SH
          COMMON=(--no-progress --embed-metadata --embed-thumbnail --windows-filenames --trim-filenames 120 --ignore-errors
                  --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
                  --extractor-args "generic:impersonate")
          [ -n "$YT_COOKIES" ] && { printf '%s\n' "$YT_COOKIES" > cookies.txt; COMMON+=(--cookies cookies.txt); echo "using cookies"; }
          # routes to try, in order: a user proxy if given; else Cloudflare WARP first (GitHub IPs are bot-flagged), then direct
          if [ -n "$YT_PROXY" ]; then ROUTES=("$YT_PROXY"); else ROUTES=(); [ "$WARP" = 1 ] && ROUTES+=(socks5://127.0.0.1:40000); ROUTES+=(direct); fi
          # the link's playlist (first MAX_ITEMS, 1-100) vs a single video
          case "$MAX_ITEMS" in ''|*[!0-9]*) MAX_ITEMS=50 ;; esac
          [ "$MAX_ITEMS" -ge 1 ] || MAX_ITEMS=1
          [ "$MAX_ITEMS" -le 100 ] || MAX_ITEMS=100
          : > names.txt        # files already sent to Drive by the per-item upload (playlists only)
          STREAM=0             # 1 = upload each finished item to Drive right away (multi-item runs with Drive configured)
          if [ "$PLAYLIST" = "yes" ]; then
            # zero-padded index so item 10 sorts after item 02 in Drive
            # --download-archive: when a retry uses the next player client, items that already finished are skipped
            COMMON+=(--yes-playlist --playlist-end "$MAX_ITEMS" --download-archive dl_archive.txt -o "out/%(playlist_title|Playlist)s/%(playlist_index)02d - %(title)s.%(ext)s")
            if [ -n "$RCLONE_CONF_BASE64" ]; then
              # Drive is configured: upload each item as soon as it is finished and delete it locally. A long video
              # playlist then never has to fit on the runner's ~14 GB disk, and a timeout or one failing item still
              # leaves everything finished so far in Drive.
              # (rclone's installer exits 3 when rclone is already installed, so only run it when it is missing)
              command -v rclone >/dev/null || { curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1; }
              mkdir -p ~/.config/rclone && echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
              COMMON+=(--exec "after_move:bash ./upload_one.sh {}")
              STREAM=1
            fi
          else
            COMMON+=(--no-playlist -o "out/%(title)s.%(ext)s")
          fi
          # Only real media counts as a result. A failed download can leave a thumbnail (.webp), a .part or a subtitle
          # file behind - counting those made a 403 look like success and uploaded the thumbnails to Drive.
          MEDIA_NAMES=(-iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.mp3' -o -iname '*.m4a' -o -iname '*.opus' -o -iname '*.ogg' -o -iname '*.flac' -o -iname '*.wav' -o -iname '*.mov')
          media_count() { find out -type f \( "${MEDIA_NAMES[@]}" \) | wc -l; }
          prune_leftovers() { find out -type f ! \( "${MEDIA_NAMES[@]}" \) -delete; }
          # true when media exists in out/, or items were already uploaded per-item
          produced() { [ "$(media_count)" -gt 0 ] || [ -s names.txt ]; }
          if [ "$FORMAT" = "audio" ]; then
            FMT=(-x --audio-format mp3 --audio-quality 0)
          else
            case "$QUALITY" in
              best) SEL="bv*+ba/b" ;;
              *)    SEL="bv*[height<=$QUALITY]+ba/b[height<=$QUALITY]" ;;
            esac
            FMT=(-f "$SEL" --merge-output-format mp4 --embed-subs --sub-langs "iw,he,en.*")
          fi
          # fallback chain: each route x each player client. A single video is done as soon as media exists. A
          # playlist is done when every item went through (yt-dlp exit 0); otherwise the next client retries the
          # missing ones (--download-archive skips finished items).
          try_routes() {
            for ROUTE in "$@"; do
              PX=(); [ "$ROUTE" != direct ] && PX=(--proxy "$ROUTE")
              for CLIENTS in "default" "web_embedded" "tv,mweb" "web_safari,android_vr"; do
                echo "::group::try route=$ROUTE player_client=$CLIENTS"
                set +e
                yt-dlp "${COMMON[@]}" "${PX[@]}" "${FMT[@]}" --extractor-args "youtube:player_client=$CLIENTS" "$INPUT" 2>&1 | tee -a dl.log
                rc=${PIPESTATUS[0]}
                set -e
                echo "::endgroup::"
                prune_leftovers
                if produced && { [ "$PLAYLIST" != yes ] || [ "$rc" -eq 0 ]; }; then echo "OK via route=$ROUTE player_client=$CLIENTS"; return 0; fi
              done
            done
            produced        # whole chain used: part of a playlist still counts as a result, nothing at all does not
          }
          # ---- Kan (Israeli public broadcaster) ----
          # Its HLS streams are licensed for Israel and the runner is abroad, so they are pulled through il-relay, a
          # Worker that Cloudflare runs in Tel Aviv. The page HTML is reachable from anywhere - only the CDN streams are
          # geo-gated - so resolve the m3u8 from the page, then hand the relay-wrapped URL to yt-dlp.
          KAN_UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          # One episode page. $1 = page URL, $2 = folder inside out/ ('' for a single episode), $3 = index prefix ('' for
          # a single episode). Returns 0 when its media file was written.
          kan_episode() {
            local url="$1" dir="$2" idx="$3" page m3u8 enc wrapped safe target x
            page=$(curl -s -A "$KAN_UA" "$url")
            m3u8=$(printf '%s' "$page" | grep -oE 'https://[a-z0-9.-]*cdn-redge\.media/[^"<> \\]*playlist\.m3u8[^"<> \\]*' | sed 's/&amp;/\&/g' | head -1)
            if [ -z "$m3u8" ]; then echo "no stream found on: $url" | tee -a dl.log; return 1; fi
            enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$m3u8")
            wrapped="$RELAY/r/playlist.m3u8?k=$RELAY_KEY&u=$enc"
            safe=$(printf '%s' "$page" | PYTHONUTF8=1 python3 kan_name.py); [ -n "$safe" ] || safe="kan_$JOB_ID"
            target="out/${dir:+$dir/}${idx:+$idx - }$safe"
            echo "file name: ${target#out/}"
            set +e
            if [ "$FORMAT" = "audio" ]; then
              yt-dlp --no-progress -f "ba/b" -x --audio-format mp3 --audio-quality 0 -o "$target.%(ext)s" "$wrapped" 2>&1 | tee -a dl.log
            else
              yt-dlp --no-progress -f "${SEL:-bv*+ba/b}" --merge-output-format mp4 -o "$target.%(ext)s" "$wrapped" 2>&1 | tee -a dl.log
            fi
            set -e
            prune_leftovers
            for x in mp4 mp3 m4a mkv webm; do [ -f "$target.$x" ] && return 0; done
            return 1
          }
          # multi-episode runs: send each finished episode to Drive at once (an episode is ~1 GB of video)
          kan_flush() {
            [ "$STREAM" = 1 ] || return 0
            find out -type f \( "${MEDIA_NAMES[@]}" \) -print0 | while IFS= read -r -d '' f; do bash ./upload_one.sh "$f"; done
          }
          # ---- Reshet 13 ----
          # One episode by its Kaltura entryId. HLS only: the progressive mp4 renditions answer 404 everywhere, and the
          # HLS ladder tops out at 720p. Straight from the runner first; when that yields nothing (Israel-only content),
          # again through il-relay (Kaltura is on its allowlist). $2 = folder, $3 = index prefix, $4 = the episode title.
          c13_episode() {
            local entry="$1" dir="$2" idx="$3" name="$4" master safe target url via x
            master="https://cdnapisec.kaltura.com/p/2748741/sp/274874100/playManifest/entryId/$entry/format/applehttp/protocol/https/a.m3u8"
            safe=$(printf '%s' "$name" | PYTHONUTF8=1 python3 kan_name.py --plain); [ -n "$safe" ] || safe="13_$entry"
            target="out/${dir:+$dir/}${idx:+$idx - }$safe"
            echo "file name: ${target#out/}"
            for via in direct relay; do
              url="$master"
              if [ "$via" = relay ]; then
                [ -n "$RELAY" ] && [ -n "$RELAY_KEY" ] || break
                url="$RELAY/r/a.m3u8?k=$RELAY_KEY&u=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$master")"
              fi
              echo "13: trying $via"
              set +e
              if [ "$FORMAT" = "audio" ]; then
                yt-dlp --no-progress -f "wb/b" -x --audio-format mp3 --audio-quality 0 -o "$target.%(ext)s" "$url" 2>&1 | tee -a dl.log
              else
                yt-dlp --no-progress -f "${SEL:-bv*+ba/b}" --merge-output-format mp4 -o "$target.%(ext)s" "$url" 2>&1 | tee -a dl.log
              fi
              set -e
              prune_leftovers
              for x in mp4 mp3; do [ -f "$target.$x" ] && { echo "OK via $via"; return 0; }; done
            done
            # Reshet blocks some items (trailers, behind-the-scenes clips) for any address but a viewer's: say so plainly
            echo "13 blocked: $safe" | tee -a dl.log
            return 1
          }
          case "$INPUT" in
            *13tv.co.il*)
              DRIVE_DIR="${C13_DRIVE_DIR:-13}"; export DRIVE_DIR; echo "DRIVE_DIR=$DRIVE_DIR" >> "$GITHUB_ENV"
              if ! PYTHONUTF8=1 python3 c13_list.py "$INPUT" "$MAX_ITEMS" > c13_eps.txt; then
                echo "REASON=could not read the 13 catalogue for this link" >> "$GITHUB_ENV"; echo "::error::13 list failed"; exit 1
              fi
              series_dir=$(head -1 c13_eps.txt | PYTHONUTF8=1 python3 kan_name.py --plain); [ -n "$series_dir" ] || series_dir="13"
              total=$(( $(wc -l < c13_eps.txt) - 1 ))
              echo "13: $total episode(s) of '$series_dir' (limit $MAX_ITEMS)"
              if [ "$total" -lt 1 ]; then echo "REASON=could not find episodes for this 13 link" >> "$GITHUB_ENV"; echo "::error::no episodes"; exit 1; fi
              i=0; c13_failed=0
              while IFS=$'\t' read -r entry name; do
                i=$((i+1))
                echo "::group::13 episode $i/$total"
                if [ "$PLAYLIST" = yes ]; then
                  if c13_episode "$entry" "$series_dir" "$(printf '%02d' "$i")" "$name"; then kan_flush; else c13_failed=$((c13_failed+1)); fi
                else
                  c13_episode "$entry" "" "" "$name" || c13_failed=$((c13_failed+1))
                fi
                echo "::endgroup::"
              done < <(tail -n +2 c13_eps.txt)
              [ "$PLAYLIST" = yes ] && rc=$c13_failed
              ;;
            *kan.org.il*)
              # Kan content goes to its own Drive folder (repo var KAN_DRIVE_DIR, default "Kan"), not into "YouTube"
              DRIVE_DIR="${KAN_DRIVE_DIR:-Kan}"; export DRIVE_DIR; echo "DRIVE_DIR=$DRIVE_DIR" >> "$GITHUB_ENV"
              [ -n "$RELAY" ] && [ -n "$RELAY_KEY" ] || { echo "REASON=Kan relay not configured (RELAY_URL/RELAY_KEY)" >> "$GITHUB_ENV"; echo "::error::relay missing"; exit 1; }
              if printf '%s' "$INPUT" | grep -qE '/p-[0-9]+/(s[0-9]+/)?$'; then
                # a whole season or series: expand to its episodes and download them one after another
                PYTHONUTF8=1 python3 kan_list.py "$INPUT" "$MAX_ITEMS" > kan_eps.txt
                series_dir=$(head -1 kan_eps.txt | PYTHONUTF8=1 python3 kan_name.py --plain); [ -n "$series_dir" ] || series_dir="Kan"
                total=$(( $(wc -l < kan_eps.txt) - 1 ))
                echo "Kan: $total episode(s) of '$series_dir' (limit $MAX_ITEMS)"
                if [ "$total" -lt 1 ]; then echo "REASON=could not find episodes on this Kan page" >> "$GITHUB_ENV"; echo "::error::no episodes"; exit 1; fi
                i=0; kan_failed=0
                while IFS= read -r ep_url; do
                  i=$((i+1))
                  echo "::group::Kan episode $i/$total"
                  if kan_episode "$ep_url" "$series_dir" "$(printf '%02d' "$i")"; then kan_flush; else kan_failed=$((kan_failed+1)); fi
                  echo "::endgroup::"
                done < <(tail -n +2 kan_eps.txt)
                rc=$kan_failed            # non-zero -> the release notes carry a "some items failed" warning
              else
                echo "::group::Kan episode via the Israeli relay"
                kan_episode "$INPUT" "" "" || true
                echo "::endgroup::"
              fi
              ;;
            *)
              try_routes "${ROUTES[@]}" || true
              # Israel-only YouTube content: Tor with an Israeli exit was tested (2026-09-30) - it bootstraps and
              # exits from Israel, but YouTube answers "Video unavailable" to Tor exits. Only YT_PROXY (a real
              # Israeli proxy) works there.
              ;;
          esac
          # media still in out/ plus the items the per-item upload already sent to Drive
          prune_leftovers
          n=$(( $(media_count) + $(wc -l < names.txt) ))
          if [ "$n" -eq 0 ]; then
            # keep the most telling reason for the site (geo-block beats the generic "unavailable")
            r=$(grep -m1 -E "not made this video available in your country|^13 blocked" dl.log || grep -m1 -E "^ERROR" dl.log || echo "unknown error")
            echo "REASON=$(printf '%s' "$r" | sed 's/^ERROR: \[youtube\] [^:]*: //; s/k=[^&[:space:]]*/k=***/g' | tr -d '\r' | cut -c1-200)" >> "$GITHUB_ENV"
            echo "::error::nothing downloaded: $r"; exit 1
          fi
          echo "COUNT=$n" >> "$GITHUB_ENV"
          # a playlist whose last attempt still had failures: say so in the release notes instead of implying all is well
          if [ "$PLAYLIST" = yes ] && [ "${rc:-0}" -ne 0 ]; then
            echo "WARN=some playlist items could not be downloaded (private, removed, blocked or a temporary error)" >> "$GITHUB_ENV"
          fi
          du -sh out; find out -type f -printf '%P\n'

      - name: Deliver
        id: deliver
        run: |
          if [ -n "$RCLONE_CONF_BASE64" ]; then
            # playlists already installed it in the Download step; its installer exits 3 when rclone is present
            command -v rclone >/dev/null || { curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1; }
            mkdir -p ~/.config/rclone && echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            rclone copy out "gdrive:$DRIVE_DIR" --transfers 2
            echo "where=Google Drive / $DRIVE_DIR ($COUNT file(s))" >> "$GITHUB_OUTPUT"
            find out -type f -printf '%P\n' >> names.txt      # what landed in Drive (per-item uploads already added theirs)
            find out -type f -delete
            printf '%s\n' "Uploaded $COUNT file(s) to Google Drive / $DRIVE_DIR" > out/_uploaded.txt
          else
            # download from the site: a single file as-is; several files (playlist) zipped into one archive
            find out -type f -printf '%P\n' >> names.txt
            if [ "$COUNT" -gt 1 ]; then
              ( cd out && zip -qr ../result.zip . && rm -rf ./* && mv ../result.zip . )
            else
              f=$(find out -type f | head -1); [ "$(dirname "$f")" = out ] || { mv "$f" out/; find out -mindepth 1 -type d -empty -delete; }
              # GitHub rewrites non-ASCII release-asset names, so this download-from-site copy gets an ASCII name
              f=$(find out -type f | head -1); b=$(basename "$f")
              if printf '%s' "$b" | LC_ALL=C grep -q '[^ -~]'; then mv -- "$f" "out/download_${JOB_ID:-file}.${b##*.}"; fi
            fi
            echo "where=download from the site" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish result
        if: always() && inputs.job_id != ''
        run: |
          notes=$(mktemp)
          { echo "yt-drive [$JOB_ID]"; echo "source: $INPUT"; echo "format: $FORMAT"; echo "delivered: ${{ steps.deliver.outputs.where || 'FAILED' }}"; if [ -n "$REASON" ]; then echo "reason: $REASON"; fi; if [ -n "$WARN" ]; then echo "warning: $WARN"; fi; if [ -f names.txt ]; then echo "files:"; sed 's/^/  /' names.txt; fi; } > "$notes"
          files=(); for f in out/*; do [ -f "$f" ] && files+=("$f"); done
          gh release create "job-$JOB_ID" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "yt $JOB_ID" --notes-file "$notes" "${files[@]}"

      - name: Cleanup old files
        if: always()
        continue-on-error: true
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name|startswith(\"job-\")) | select(.created_at < \"$cutoff\") | .tag_name" |
          while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y; done
