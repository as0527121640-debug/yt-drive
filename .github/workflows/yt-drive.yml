# yt-drive - download a YouTube video/audio with yt-dlp and (if rclone is configured) push it to Google Drive.
# Triggered by the yt-drive Cloudflare Worker (cloud/yt-drive) or manually from the Actions tab.
# If secret RCLONE_CONF_BASE64 is set -> the file goes to Drive (folder from var DRIVE_DIR, default "YouTube").
# Otherwise the file is attached to the job-<id> prerelease so the site can download it.
name: yt-drive
run-name: "yt [${{ inputs.job_id }}]: ${{ inputs.input }}"

on:
  workflow_dispatch:
    inputs:
      input:
        description: 'YouTube URL'
        required: true
      format:
        description: 'video (mp4) or audio (mp3)'
        type: choice
        options: [video, audio]
        default: video
      quality:
        description: 'max video quality'
        type: choice
        options: [best, "1080", "720", "480"]
        default: "1080"
      playlist:
        description: 'download the playlist the link points to (instead of only the single video)'
        type: choice
        options: ["no", "yes"]
        default: "no"
      max_items:
        description: 'playlist: how many items from the start (1-100)'
        required: false
        default: "50"
      job_id:
        description: 'site job id (empty for manual runs)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 240                              # a 100-item video playlist is long; single videos finish in minutes
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.job_id }}
      INPUT: ${{ inputs.input }}
      FORMAT: ${{ inputs.format }}
      QUALITY: ${{ inputs.quality }}
      PLAYLIST: ${{ inputs.playlist }}
      MAX_ITEMS: ${{ inputs.max_items }}
      RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONF_BASE64 }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}          # optional: Netscape cookies.txt of a (secondary) Google account
      YT_PROXY: ${{ secrets.YT_PROXY }}              # optional: http(s)/socks proxy, e.g. a residential/Israeli one
      RELAY: ${{ vars.RELAY_URL }}                   # il-relay Worker (runs in Cloudflare Tel Aviv) for Kan streams
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      DRIVE_DIR: ${{ vars.DRIVE_DIR || 'YouTube' }}
    # YouTube flags datacenter IPs ("Sign in to confirm you're not a bot"). The open-source answer (yt-dlp, cobalt,
    # Invidious) is a chain: PO token + visitor_data from a BotGuard generator, then alternate player clients, then
    # cookies/proxy if provided. The generator runs here as a sidecar - the one yt-dlp's own PO-token guide recommends.
    services:
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - name: Install tools
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg
          # deno: yt-dlp's JS runtime for YouTube's player challenge
          curl -fsSL https://deno.land/install.sh | sh -s -- -y >/dev/null 2>&1
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          # yt-dlp from pip so the PO-token plugin is discovered next to it
          python3 -m venv "$HOME/ytv"
          # curl-cffi: browser impersonation, needed by sites like kan.org.il (generic extractor + Kaltura HLS)
          "$HOME/ytv/bin/pip" install -q -U "yt-dlp[default,curl-cffi]" bgutil-ytdlp-pot-provider
          echo "$HOME/ytv/bin" >> "$GITHUB_PATH"
          "$HOME/ytv/bin/yt-dlp" --version

      # Cloudflare WARP in proxy mode: a free egress through Cloudflare's IPs instead of GitHub's flagged Azure ones.
      - name: Start Cloudflare WARP (proxy mode)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null
          sudo apt-get -qq update && sudo apt-get -qq install -y cloudflare-warp
          sudo systemctl start warp-svc || true; sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          for i in $(seq 1 15); do
            ip=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc)=' | tr '\n' ' ')
            case "$ip" in *warp=on*|*warp=plus*) echo "WARP up: $ip"; echo "WARP=1" >> "$GITHUB_ENV"; break;; esac
            sleep 2
          done

      - name: Download
        run: |
          mkdir -p out
          # Kan file name from the episode page. Unicode-aware on purpose: an ASCII-only filter (tr [:alnum:]) deletes
          # every Hebrew letter and left "_1.mp4" for "עלומים | פרק 1".
          cat > kan_name.py <<'PY'
          import html, json, re, sys
          h = sys.stdin.read()
          name = ""
          # 1) the page's VideoObject in JSON-LD carries the full title: "series | episode - subtitle"
          for blk in re.findall(r'<script[^>]*type="application/ld\+json"[^>]*>(.*?)</script>', h, re.S):
              try:
                  data = json.loads(blk)
              except ValueError:
                  continue
              stack = [data]
              while stack and not name:
                  o = stack.pop()
                  if isinstance(o, list):
                      stack.extend(o)
                  elif isinstance(o, dict):
                      if o.get("@type") == "VideoObject" and o.get("name"):
                          name = o["name"]
                      stack.extend(o.values())
          # 2) fall back to og:title, then <title>
          if not name:
              for pat in (r'<meta property="og:title" content="([^"]*)"', r"<title>([^<]*)"):
                  m = re.search(pat, h)
                  if m:
                      name = m.group(1)
                      break
          name = html.unescape(name)
          name = re.sub(r"\s*\|\s*", " - ", name)                # "series | episode" -> "series - episode"
          name = re.sub(r'[\\/:*?"<>%\x00-\x1f]', " ", name)      # illegal in file names / yt-dlp output templates
          name = re.sub(r"\s+", " ", name).strip(" .-")
          print(name[:110].rstrip(" .-"))
          PY
          # Per-item upload for playlists (used with yt-dlp --exec after_move): send the finished file to Drive, delete
          # the local copy, and record its path for the release notes.
          cat > upload_one.sh <<'SH'
          f="$1"
          rel=$(realpath -m --relative-to=out "$f")
          if rclone moveto "$f" "gdrive:${DRIVE_DIR}/${rel}" --log-level ERROR; then
            printf '%s\n' "$rel" >> names.txt
          else
            echo "upload failed for: $rel (kept on the runner; the final copy step retries it)" >&2
          fi
          SH
          COMMON=(--no-progress --embed-metadata --embed-thumbnail --windows-filenames --trim-filenames 120 --ignore-errors
                  --extractor-args "youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416"
                  --extractor-args "generic:impersonate")
          [ -n "$YT_COOKIES" ] && { printf '%s\n' "$YT_COOKIES" > cookies.txt; COMMON+=(--cookies cookies.txt); echo "using cookies"; }
          # routes to try, in order: a user proxy if given; else Cloudflare WARP first (GitHub IPs are bot-flagged), then direct
          if [ -n "$YT_PROXY" ]; then ROUTES=("$YT_PROXY"); else ROUTES=(); [ "$WARP" = 1 ] && ROUTES+=(socks5://127.0.0.1:40000); ROUTES+=(direct); fi
          # the link's playlist (first MAX_ITEMS, 1-100) vs a single video
          case "$MAX_ITEMS" in ''|*[!0-9]*) MAX_ITEMS=50 ;; esac
          [ "$MAX_ITEMS" -ge 1 ] || MAX_ITEMS=1
          [ "$MAX_ITEMS" -le 100 ] || MAX_ITEMS=100
          : > names.txt        # files already sent to Drive by the per-item upload (playlists only)
          if [ "$PLAYLIST" = "yes" ]; then
            # zero-padded index so item 10 sorts after item 02 in Drive
            COMMON+=(--yes-playlist --playlist-end "$MAX_ITEMS" -o "out/%(playlist_title|Playlist)s/%(playlist_index)02d - %(title)s.%(ext)s")
            if [ -n "$RCLONE_CONF_BASE64" ]; then
              # Drive is configured: upload each item as soon as it is finished and delete it locally. A long video
              # playlist then never has to fit on the runner's ~14 GB disk, and a timeout or one failing item still
              # leaves everything finished so far in Drive.
              curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
              mkdir -p ~/.config/rclone && echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
              COMMON+=(--exec "after_move:bash ./upload_one.sh {}")
            fi
          else
            COMMON+=(--no-playlist -o "out/%(title)s.%(ext)s")
          fi
          # true when something was produced: files still in out/, or items already uploaded per-item
          produced() { [ "$(find out -type f | wc -l)" -gt 0 ] || [ -s names.txt ]; }
          if [ "$FORMAT" = "audio" ]; then
            FMT=(-x --audio-format mp3 --audio-quality 0)
          else
            case "$QUALITY" in
              best) SEL="bv*+ba/b" ;;
              *)    SEL="bv*[height<=$QUALITY]+ba/b[height<=$QUALITY]" ;;
            esac
            FMT=(-f "$SEL" --merge-output-format mp4 --embed-subs --sub-langs "iw,he,en.*")
          fi
          # fallback chain: each route x each player client; stop at the first that produces files
          try_routes() {
            for ROUTE in "$@"; do
              PX=(); [ "$ROUTE" != direct ] && PX=(--proxy "$ROUTE")
              for CLIENTS in "default" "web_embedded" "tv,mweb" "web_safari,android_vr"; do
                echo "::group::try route=$ROUTE player_client=$CLIENTS"
                yt-dlp "${COMMON[@]}" "${PX[@]}" "${FMT[@]}" --extractor-args "youtube:player_client=$CLIENTS" "$INPUT" 2>&1 | tee -a dl.log || true
                echo "::endgroup::"
                if produced; then echo "OK via route=$ROUTE player_client=$CLIENTS"; return 0; fi
              done
            done
            return 1
          }
          # Kan (Israeli public broadcaster): its HLS is licensed for Israel and the runner is abroad, so pull it
          # through il-relay, which Cloudflare runs in Tel Aviv. The page HTML itself is reachable from anywhere -
          # only the CDN streams are geo-gated - so resolve the m3u8 here, then hand the relay-wrapped URL to yt-dlp.
          case "$INPUT" in
            *kan.org.il*)
              echo "::group::Kan via Israeli relay"
              [ -n "$RELAY" ] && [ -n "$RELAY_KEY" ] || { echo "REASON=Kan relay not configured (RELAY_URL/RELAY_KEY)" >> "$GITHUB_ENV"; echo "::error::relay missing"; exit 1; }
              UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
              page=$(curl -s -A "$UA" "$INPUT")
              m3u8=$(printf '%s' "$page" | grep -oE 'https://[a-z0-9.-]*cdn-redge\.media/[^"<> \\]*playlist\.m3u8[^"<> \\]*' | sed 's/&amp;/\&/g' | head -1)
              [ -n "$m3u8" ] || { echo "REASON=could not find the Kan stream on the page" >> "$GITHUB_ENV"; echo "::error::no m3u8"; exit 1; }
              enc=$(python3 -c 'import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=""))' "$m3u8")
              wrapped="$RELAY/r/playlist.m3u8?k=$RELAY_KEY&u=$enc"
              safe=$(printf '%s' "$page" | PYTHONUTF8=1 python3 kan_name.py); [ -n "$safe" ] || safe="kan_$JOB_ID"
              echo "file name: $safe"
              if [ "$FORMAT" = "audio" ]; then
                yt-dlp --no-progress --hls-use-mpegts -x --audio-format mp3 --audio-quality 0 -o "out/$safe.%(ext)s" "$wrapped" 2>&1 | tee -a dl.log || true
              else
                yt-dlp --no-progress -f "${SEL:-bv*+ba/b}" --merge-output-format mp4 -o "out/$safe.%(ext)s" "$wrapped" 2>&1 | tee -a dl.log || true
              fi
              echo "::endgroup::"
              ;;
            *)
              try_routes "${ROUTES[@]}" || true
              # Israel-only YouTube content: Tor with an Israeli exit was tested (2026-09-30) - it bootstraps and
              # exits from Israel, but YouTube answers "Video unavailable" to Tor exits. Only YT_PROXY (a real
              # Israeli proxy) works there.
              ;;
          esac
          # files still in out/ plus the ones the per-item upload already sent to Drive
          n=$(( $(find out -type f | wc -l) + $(wc -l < names.txt) ))
          if [ "$n" -eq 0 ]; then
            # keep the most telling reason for the site (geo-block beats the generic "unavailable")
            r=$(grep -m1 -E "not made this video available in your country" dl.log || grep -m1 -E "^ERROR" dl.log || echo "unknown error")
            echo "REASON=$(printf '%s' "$r" | sed 's/^ERROR: \[youtube\] [^:]*: //' | tr -d '\r' | cut -c1-200)" >> "$GITHUB_ENV"
            echo "::error::nothing downloaded: $r"; exit 1
          fi
          echo "COUNT=$n" >> "$GITHUB_ENV"
          du -sh out; find out -type f -printf '%P\n'

      - name: Deliver
        id: deliver
        run: |
          if [ -n "$RCLONE_CONF_BASE64" ]; then
            curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
            mkdir -p ~/.config/rclone && echo "$RCLONE_CONF_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            rclone copy out "gdrive:$DRIVE_DIR" --transfers 2
            echo "where=Google Drive / $DRIVE_DIR ($COUNT file(s))" >> "$GITHUB_OUTPUT"
            find out -type f -printf '%P\n' >> names.txt      # what landed in Drive (per-item uploads already added theirs)
            find out -type f -delete
            printf '%s\n' "Uploaded $COUNT file(s) to Google Drive / $DRIVE_DIR" > out/_uploaded.txt
          else
            # download from the site: a single file as-is; several files (playlist) zipped into one archive
            find out -type f -printf '%P\n' >> names.txt
            if [ "$COUNT" -gt 1 ]; then
              ( cd out && zip -qr ../result.zip . && rm -rf ./* && mv ../result.zip . )
            else
              f=$(find out -type f | head -1); [ "$(dirname "$f")" = out ] || { mv "$f" out/; find out -mindepth 1 -type d -empty -delete; }
              # GitHub rewrites non-ASCII release-asset names, so this download-from-site copy gets an ASCII name
              f=$(find out -type f | head -1); b=$(basename "$f")
              if printf '%s' "$b" | LC_ALL=C grep -q '[^ -~]'; then mv -- "$f" "out/download_${JOB_ID:-file}.${b##*.}"; fi
            fi
            echo "where=download from the site" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish result
        if: always() && inputs.job_id != ''
        run: |
          notes=$(mktemp)
          { echo "yt-drive [$JOB_ID]"; echo "source: $INPUT"; echo "format: $FORMAT"; echo "delivered: ${{ steps.deliver.outputs.where || 'FAILED' }}"; if [ -n "$REASON" ]; then echo "reason: $REASON"; fi; if [ -f names.txt ]; then echo "files:"; sed 's/^/  /' names.txt; fi; } > "$notes"
          files=(); for f in out/*; do [ -f "$f" ] && files+=("$f"); done
          gh release create "job-$JOB_ID" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "yt $JOB_ID" --notes-file "$notes" "${files[@]}"

      - name: Cleanup old files
        if: always()
        continue-on-error: true
        run: |
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name|startswith(\"job-\")) | select(.created_at < \"$cutoff\") | .tag_name" |
          while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --cleanup-tag -y; done
